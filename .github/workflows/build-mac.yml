name: Build macOS

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]

    runs-on: macos-latest
    name: macOS ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pokud nejsou nastaveny signing secrets, build proběhne bez podpisu.
      # Potřebné GitHub secrets:
      #   MAC_CERTIFICATE           – base64 zakódovaný .p12 certifikát
      #   MAC_CERTIFICATE_PASSWORD  – heslo k certifikátu
      #   APPLE_ID                  – Apple ID pro notarizaci
      #   APPLE_APP_SPECIFIC_PASSWORD – app-specific heslo pro notarizaci
      #   APPLE_TEAM_ID             – Team ID z Apple Developer účtu
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mluvitko-macos-arm64.dmg.zip
          path: dist/*-arm64.dmg
          if-no-files-found: error

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mluvitko-macos-x64.dmg.zip
          path: |
            dist/*.dmg
            !dist/*-arm64.dmg
          if-no-files-found: error

  # Vytvoří GitHub Release a nahraje artefakty při push tagu v*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
