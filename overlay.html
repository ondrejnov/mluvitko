<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .ring {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid rgba(255, 59, 48, 0.4);
      opacity: 0;
    }

    .dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow:
        0 0 0 0 rgba(255, 59, 48, 0.6),
        0 2px 8px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.15s ease;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mikrofon ikonka uvnitř tečky */
    .dot .mic-icon {
      width: 16px;
      height: 16px;
      fill: white;
      pointer-events: none;
    }

    /* Aktivní stav – nahrávání */
    body.active .dot {
      opacity: 1;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    body.active .ring {
      opacity: 1;
      animation: pulse-ring 1.2s ease-in-out infinite;
    }

    /* Stav přepisu */
    body.transcribing .dot {
      opacity: 1;
      background: #007aff;
      box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.5), 0 2px 8px rgba(0,0,0,0.4);
      animation: spin 1s linear infinite;
    }

    body.transcribing .dot .mic-icon {
      display: none;
    }

    @keyframes pulse-dot {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6), 0 2px 8px rgba(0,0,0,0.4);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 0 8px rgba(255, 59, 48, 0), 0 2px 8px rgba(0,0,0,0.4);
      }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="ring"></div>
  <div class="dot">
    <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 9a6 6 0 0 0 11.95 1H19a7 7 0 0 1-6 6.93V20h3v2H8v-2h3v-3.07A7 7 0 0 1 5 10h2z"/>
    </svg>
  </div>

  <script>
    const { ipcRenderer } = require('electron')

    ipcRenderer.on('recording-start', () => {
      document.body.classList.remove('transcribing')
      document.body.classList.add('active')
    })

    ipcRenderer.on('recording-stop', () => {
      document.body.classList.remove('active')
    })

    ipcRenderer.on('transcribing', () => {
      document.body.classList.remove('active')
      document.body.classList.add('transcribing')
    })
  </script>
</body>
</html>
